# motir-marketing on Fly.io — the production runtime configuration (MOTIR-1455).
#
# The decision this file implements is `motir-core/docs/decisions/
# marketing-site-hosting.md` — Q1 (Fly, a second app in org `moooon`, region
# `iad`), Q2 (the motir.co records), Q3 (the CI shape). §8 of that record hands
# the machine pool, the availability floor and the VM size to THIS card, which is
# what the block at the bottom sets and records.
#
# ⚠️ THIS FILE CONFIGURES; IT DOES NOT PROVISION — `application-hosting.md`
# Amendment 7. The app was created by `flyctl apps create`, the machines by the
# first `flyctl deploy`, and the pool by `fly scale count`. No key here brings
# anything into existence.

app            = "motir-marketing"   # org `moooon`, fixed at creation — this
                                     # line is a reading of the platform, not a
                                     # request to it.
primary_region = "iad"               # beside motir-core and motir-ai.

[build]
  dockerfile = "Dockerfile"

  # The ONE configured motir-core origin the landing's three cross-origin doors
  # are built from (MOTIR-1152). It is a BUILD arg rather than a `[env]` entry
  # or a Fly secret because `NEXT_PUBLIC_*` is inlined by `next build`: a
  # runtime variable would arrive after the image that needed it already
  # existed. It is not a secret — it is the public address of the app this site
  # hands readers across to — so it is stated here, in the repository, where a
  # reader can see which origin a release points at.
  [build.args]
    NEXT_PUBLIC_MOTIR_APP_ORIGIN = "https://app.motir.co"

    # The base domain a workspace's public subdomain lives under (MOTIR-4220 ·
    # ADR `public-tenant-addresses.md` §2). Same build-arg reasoning as the
    # origin above, and the same non-secret: it is the public suffix every
    # tenant address is spelled with. `lib/tenantDomain.ts` FAILS THE BUILD when
    # it is absent from a production build, because a silent fallback would make
    # the real base domain look like an unknown tenant host and 404 it.
    #
    # ⚠️ IT IS `motir.site`, NOT A SUBDOMAIN OF `motir.co`, and that is the
    # ADR's §2 decision rather than a convenience: a customer's project served
    # from `*.motir.co` would share a registrable domain with the application,
    # so one tenant's cookie scope, one tenant's HSTS preload and one tenant's
    # abuse report would reach `motir.co` itself. A separate registrable domain
    # is the boundary. The apex and the wildcard are certificated on THIS app
    # (`fly certs list -a motir-marketing`, MOTIR-4208).
    NEXT_PUBLIC_MOTIR_TENANT_DOMAIN = "motir.site"

# No [deploy] release_command: this app has no database and nothing to migrate.
# No [processes]: one web process, so Fly runs the image's CMD and routes HTTP to
# every machine — which is what `http_service` below then means.

[env]
  PORT = "8080"
  # HOSTNAME=0.0.0.0 is set in the Dockerfile, not here — see the ⚠️ on it there.

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  # ⚠️ 1, AND IT IS AN AVAILABILITY DECISION — not a capacity one
  # (`application-hosting.md` Amendment 7 §14, which is emphatic that the floor
  # is the availability decision and that this file cannot create the pool).
  #
  # motir-core runs a floor of 2 because losing one machine there is a
  # user-visible gap in an interactive application. This is a static marketing
  # page: the cost of a machine being restarted is a few seconds of 502 on a
  # page nobody is mid-workflow on, and the cost of a floor of 0 is a cold boot
  # on the FIRST visit after every idle period — including Googlebot's, on the
  # host whose entire job is to be the entity signal for the domain
  # (MOTIR-1154). One warm machine is the cheap answer to that: it is what
  # `auto_stop_machines` would otherwise take away.
  #
  # COST: one shared-cpu-1x / 512 MB machine, always warm. TRIGGER to revise
  # upward: the first real traffic reading that shows one machine saturating, or
  # a decision that marketing-site downtime is user-visible in a way this
  # paragraph says it is not.
  #
  # ⚠️ THE POOL IS 2 AND THE FLOOR IS 1 — read from the platform on 2026-08-28,
  # after the first release, not from this file:
  #
  #   fly machine list -a motir-marketing
  #     85761d2a4134e8  app  iad  started  shared-cpu-1x:512MB
  #     d893299a5d4708  app  iad  started  shared-cpu-1x:512MB
  #
  # `flyctl deploy` created BOTH — Fly's default for a new app's first release is
  # two machines, and no `fly scale count` was run. The pool is therefore 2 and
  # is KEPT at 2: a stopped machine bills no compute, so the second one costs
  # nothing until the proxy starts it, and running `fly scale count 1` against a
  # group already at its intended count risks destroying a machine to save
  # nothing. The floor below is what decides how many of those two stay WARM,
  # and that is the line that costs money.
  min_machines_running = 1

  # ⚠️ NOT MEASURED. A Next standalone server has never been measured on this
  # box for this workload, and these are motir-core's numbers scaled down rather
  # than a reading. Labelled as an estimate so nobody quotes it back as one.
  # TRIGGER to revise: the first sustained request-concurrency reading from Fly
  # metrics.
  [http_service.concurrency]
    type       = "requests"
    soft_limit = 100
    hard_limit = 150

# ⚠️ THE VM SIZE WAS A GUESS AND IS NOW A MEASUREMENT. 512 MB was chosen as the
# smallest size with plausible headroom, on the reasoning that motir-core needs
# 390 MB for an application with hundreds of routes and a database client while
# this app has one page and neither.
#
# MEASURED 2026-08-28 on machine 85761d2a4134e8, reading /proc/<next-server>/status
# through `fly machine exec` after the first release had served traffic:
#
#   VmRSS 81,980 kB = 80 MB   ·   VmHWM 81,980 kB   ·   MemTotal 469,900 kB
#
# ~5.7x headroom, comparable to motir-core's measured 4.9x. ⚠️ AT IDLE, so it
# sizes the BASELINE and says nothing about load — it is recorded so the trigger
# below has something to fire against. TRIGGER: a VmRSS reading above ~350 MB,
# or an OOM in the machine's events.
[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
  cpus   = 1
