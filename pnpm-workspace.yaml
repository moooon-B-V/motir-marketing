# Not a workspace — this repository is a single package. The file exists because
# pnpm 11 reads its BUILD ALLOWLIST from here, and an install that leaves a
# native dependency's build script undecided exits 1 with
# ERR_PNPM_IGNORED_BUILDS. Both entries below are decisions, not noise.
allowBuilds:
  # Next's optional image-optimisation dependency. Its install script picks up
  # the prebuilt @img/sharp-linux-* binary for the platform rather than
  # compiling libvips, so allowing it costs nothing and skipping it would leave
  # `next/image` unoptimised in production.
  sharp: true
  # The native resolver behind eslint-import-resolver-typescript, which
  # eslint-config-next pulls in. Its postinstall only selects the prebuilt
  # binding for the platform.
  unrs-resolver: true
# ⚠️ A NARROW, SELF-EXPIRING SUPPLY-CHAIN EXEMPTION — added by MOTIR-1152, and
# it is load-bearing TODAY rather than tidy-up. pnpm 11 rejects a lockfile
# entry published inside a rolling ~24h `minimumReleaseAge` cutoff, and
# `@motir/brand@0.1.0` was hand-published at 2026-08-28T19:58Z (MOTIR-3802) —
# hours before this landing needed it. Without this line
# `pnpm install --frozen-lockfile` fails EVERY job in `ci.yml`:
#
#   [ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION] @motir/brand@0.1.0 was published
#   at 2026-08-28T19:58:20Z, within the minimumReleaseAge cutoff
#
# It exempts ONE exact version, so it stops matching anything the moment
# `@motir/brand` is bumped — DELETE IT THEN. It is not a general relaxation of
# the policy and must not become one: a second entry here is a signal to wait a
# day rather than to add a line.
minimumReleaseAgeExclude:
  - '@motir/brand@0.1.0'
