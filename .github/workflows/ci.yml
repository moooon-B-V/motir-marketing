# motir-marketing CI — MOTIR-1455.
#
# This MIRRORS motir-core's `ci.yml` rather than copying it: that file declares
# `needs: [lint, typecheck, build, test, coverage, e2e, e2e-at-scale]`, and four
# of those jobs do not exist here. The shape to keep, per
# `motir-core/docs/decisions/marketing-site-hosting.md` Q3, is the deploy job's:
# gate on what exists, deploy only on a push to main, and give the release its
# OWN non-cancelling concurrency group. Add a gate to `needs` below as this
# repository grows one — do not declare a gate before its job exists.
#
# MOTIR-1152 grew the first one: `test` (vitest, `vitest.config.mts`), added
# BELOW and to `deploy`'s `needs` in the same change, exactly as that sentence
# asks. There is still no `coverage`, `e2e` or `e2e-at-scale` job here and
# `needs` still names none.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # ⚠️ THE BUILD FAILS WITHOUT THIS, BY DESIGN (MOTIR-1152). `lib/appOrigin.ts`
  # throws `MotirAppOriginError` at module scope when the variable is unset,
  # which is what stops a release shipping a landing page whose three doors
  # point at `undefined`. It is set HERE, once, for the `Build` check.
  #
  # ⚠️ THIS IS NOT WHAT THE RELEASE USES. `NEXT_PUBLIC_*` is inlined by
  # `next build`, and the `deploy` job below builds inside DOCKER — where a job
  # env var does not reach. The released value is `fly.toml`'s `[build.args]`,
  # and the `Dockerfile`'s `ARG` is what carries it in. Two sites, one meaning;
  # changing the origin means changing both.
  NEXT_PUBLIC_MOTIR_APP_ORIGIN: 'https://app.motir.co'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # ── The unit / component suite (MOTIR-1152) ───────────────────────────────
  #
  # This repository's FIRST test job. It is a `needs` gate on `deploy` from the
  # moment it exists, per the header: a red suite must not reach motir.co.
  #
  # Node environment plus jsdom (`vitest.config.mts`) — there is no database
  # and nothing to seed, so the whole suite is seconds. `tests/appOrigin.test.ts`
  # is the one acceptance criterion that asks to be asserted "with a test, not
  # by inspection".
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # ── Publish the DESIGN RESULT to its work item (MOTIR-3750) ───────────────
  #
  # This repository holds design assets (`design/<area>/`) and, until this job,
  # published none of them: the design-result publisher is a STEP of motir-core's
  # `design-guards` job, and that job has no counterpart here. So MOTIR-1143's
  # asset merged into a card that showed nothing — the deliverable is the design
  # RESULT on the card, not the pull request (motir-core
  # `docs/decisions/design-result.md`).
  #
  # ⚠️ A JOB HERE, A STEP THERE, AND THAT IS NOT AN INCONSISTENCY. In motir-core
  # the publish is a step because `design-guards` already runs on every pull
  # request to read `design/**` — a step adds no check anywhere. This repository
  # has no such host job, and hanging a publish off `lint` would run it on
  # push-to-main too. A gated job is the shape THIS file already uses for
  # `deploy`, so the greyed `Skipped` a job-level `if:` reports on the other
  # trigger is a cost this repository has already accepted once.
  #
  # ⚠️ NOT IN `deploy`'s `needs`. The header above says to add a gate as the
  # repository grows one — a publish is NOT a gate. A release must not wait on
  # it, and must not fail because of it.
  #
  # ⚠️ NO `continue-on-error`, matching motir-core. Every case that should pass
  # quietly is handled INSIDE the script, which returns 0 for each: no design
  # artifact in the diff, no resolvable card in the branch/title, and no
  # credential. What is left for red to mean is a publish that should have
  # happened and did not.
  design-result:
    name: Design result
    runs-on: ubuntu-latest
    # `pull_request` ONLY — re-publishing an identical result after the merge is
    # what motir-core's own step avoids (`design-result.md` §6).
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      # KEYLESS. The publish authenticates off this job's GitHub Actions OIDC
      # identity — no token is minted, stored or rotated — exactly as
      # motir-core's `design-guards` job does. `authHeadersFor` prefers the OIDC
      # marker whenever the script can mint one; the server verifies the JWT
      # against GitHub's JWKS and resolves the tenant from the verified
      # `repository` claim (`githubRepoRepository.findConnectedByName`).
      #
      # ⚠️ THIS LINE HAS A PRECONDITION, and it is the repository being
      # CONNECTED to Motir. Until 2026-08-28 it was not, and the claim resolved
      # to `403 repo_not_connected` — so granting this would have turned the job
      # RED on every pull request rather than making it keyless. That is why the
      # lane shipped without it (MOTIR-3750) and why this is a separate change.
      # MOTIR-3743 closed it: `link_pull_request` and a `targetRepo` pin both
      # now resolve `moooon-B-V/motir-marketing`. **If this repository is ever
      # disconnected, remove this line in the same change** — the failure mode is
      # a red check on every pull request, not a quiet skip.
      #
      # No `MOTIR_UPLOAD_TOKEN` secret is needed and none is set; the PAT arm
      # below stays only as the fork-PR fallback, where GitHub denies OIDC.
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # ⚠️ FETCHED FROM motir-core, NOT FORKED. `upload-design-assets.mjs` is ~980
      # lines of load-bearing publisher logic guarded by specs that live in
      # motir-core (`vitest.design.config.ts`); a second copy is the kind of
      # duplication where one copy quietly gets a fix and the other does not —
      # the reason `@motir/design-system` and `@motir/brand` exist at all.
      #
      # It is fetchable because motir-core is a PUBLIC repository, and runnable
      # because the script imports only `node:child_process`, `node:fs` and
      # `node:path` plus global `fetch` — zero external dependencies, so bare
      # `node` runs it with no install.
      #
      # PINNED TO A COMMIT, never to `main`: a git SHA is content-addressed, so
      # this fetch is reproducible and a motir-core change cannot alter what runs
      # here without a diff in this file. Bump the pin deliberately.
      #
      # ⚠️ The long-term home of this mechanism is a DECISION, not this comment —
      # a script shared by two repositories is the same question MOTIR-3724
      # answered for the brand chrome. Filed with MOTIR-3750.
      - name: Fetch the design-result publisher from motir-core
        env:
          # motir-core@6e71acf21c1426180bf502c387e221108930e381 (2026-08-28)
          PUBLISHER_REF: 6e71acf21c1426180bf502c387e221108930e381
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/upload-design-assets.mjs" \
            "https://raw.githubusercontent.com/moooon-B-V/motir-core/${PUBLISHER_REF}/scripts/upload-design-assets.mjs"
          echo "Fetched publisher from motir-core@${PUBLISHER_REF}"

      - name: Publish the design result
        env:
          # The FORK fallback, and nothing else — deliberately left wired and
          # deliberately UNSET. GitHub denies OIDC to a pull request from a fork,
          # so `requestGithubOidcToken` returns null there and the script would
          # reach for a PAT; with no secret it logs "No OIDC identity and no
          # MOTIR_UPLOAD_TOKEN — publishing is opt-in; skipping" and returns 0,
          # which is the right outcome for a fork (a publish must not be
          # attributable to somebody else's branch).
          #
          # It is NOT the primary path any more and should stay empty: a token
          # granted `work_item:edit` (motir-core `lib/tokens/grant.ts` →
          # `DESIGN_PUBLISH_PERMISSION`) would work — the PAT arm is
          # repository-agnostic — but it is a stored credential bought for
          # nothing now that the keyless identity above resolves.
          MOTIR_UPLOAD_TOKEN: ${{ secrets.MOTIR_UPLOAD_TOKEN }}
          MOTIR_BASE_URL: ${{ vars.MOTIR_BASE_URL || 'https://app.motir.co' }}
          DESIGN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DESIGN_PR_REF: ${{ github.head_ref }}
          DESIGN_PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # A pull_request checkout is the MERGE commit at depth 1, which carries
          # both parents — so the base is normally already present. Fetch it if
          # it is not, rather than paying `fetch-depth: 0` on every run. The
          # script's own `resolveDiffBase` deepens by one commit when a shallow
          # clone has grafted HEAD's parents away; this line covers the base sha
          # itself, which that deepen does not reach.
          git cat-file -e "${DESIGN_BASE_SHA}^{commit}" 2>/dev/null ||
            git fetch --depth=1 origin "${DESIGN_BASE_SHA}"
          node "${RUNNER_TEMP}/upload-design-assets.mjs"

  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # A release must NOT be cancelled mid-flight by a newer push — the
    # workflow-level `cancel-in-progress` above is right for a test run and
    # wrong for a deploy, so this group overrides it. It is also its OWN group
    # (`fly-deploy-marketing`, not motir-core's `fly-deploy`): two repositories
    # sharing one group name would serialise unrelated releases.
    concurrency:
      group: fly-deploy-marketing
      cancel-in-progress: false
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      # An APP-scoped deploy token (`flyctl tokens create deploy -a
      # motir-marketing`) — not an org token. An app token cannot create
      # Machines in, or even see, sibling apps in the same org, and it does
      # carry `registry.fly.io` write for its own app, which is all a deploy
      # needs.
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: motir-marketing
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # `--local-only` builds on the runner's own Docker daemon and pushes to
      # registry.fly.io, instead of Fly's remote builder — which flaked with
      # repeated 503s for motir-ai even while Fly itself was operational.
      - run: flyctl deploy --local-only --app "$FLY_APP"
      # Prove the RELEASE, not a DNS record: this reads the Fly-owned hostname,
      # so it is green before motir.co points anywhere and stays honest after.
      - name: Smoke the release on its Fly hostname
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 \
            --retry-all-errors "https://$FLY_APP.fly.dev/")
          echo "GET https://$FLY_APP.fly.dev/ -> $code"
          [ "$code" = "200" ]
